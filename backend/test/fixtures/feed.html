<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Feed | LinkedIn</title></head>
<body>
<header id="global-nav" class="global-nav" aria-label="Global Navigation">
  <div class="global-nav__content">
    <nav class="global-nav__nav" aria-label="Primary Navigation">
      <a href="https://www.linkedin.com/feed/" class="global-nav__primary-link global-nav__primary-link--active">Home</a>
      <a href="https://www.linkedin.com/mynetwork/" class="global-nav__primary-link">My Network</a>
      <a href="https://www.linkedin.com/messaging/" class="global-nav__primary-link">Messaging</a>
      <button class="global-nav__primary-link global-nav__me" data-test-global-nav-me type="button">
        <img class="global-nav__me-photo evi-image" alt="Sam Sender" src="https://media.licdn.com/dms/image/v2/D4D03AQ/profile-displayphoto-shrink_100_100/0/1690000000000?e=1&amp;v=beta&amp;t=sam">
        <span>Me</span>
      </button>
    </nav>
  </div>
</header>
<div class="application-outlet">
  <div class="scaffold-layout">
    <aside class="scaffold-layout__sidebar">
      <div class="feed-identity-module">
        <a href="https://www.linkedin.com/in/sam-sender/" class="ember-view block"><div class="t-16 t-black t-bold">Sam Sender</div></a>
        <p class="t-12 t-black--light">Founder at Outbound Co</p>
      </div>
    </aside>
    <main id="main" class="scaffold-layout__main" aria-label="Main Feed">
      <div class="share-box-feed-entry__wrapper"><button class="share-box-feed-entry__trigger" aria-label="Start a post">Start a post</button></div>
      <h2 class="visually-hidden">Feed post number 1</h2>
      <div data-urn="urn:li:activity:7200000000000000000" class="feed-shared-update-v2"><p>Hello world</p></div>
    </main>
  </div>
</div>
</body>
</html>

<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Activity | Jane Doe | LinkedIn</title></head>
<body>
<!-- {{POSTS}}: "posts" renders two posts (the first one {{LIKED}}), "none" the empty state. -->
<header id="global-nav" class="global-nav"></header>
<main id="main" class="scaffold-layout__main">
  <section class="artdeco-card">
    <h2 class="t-20">All activity</h2>
    <div class="pv-recent-activity-detail__core-rail" id="rail"></div>
  </section>
</main>
<script>
  const mode = '{{POSTS}}'
  let liked = '{{LIKED}}' === 'liked'
  window.__log = []
  const post = (urn, text, first) => `
    <div class="profile-creator-shared-feed-update__container">
      <div data-urn="urn:li:activity:${urn}" class="feed-shared-update-v2 feed-shared-update-v2--minor-padding full-height relative artdeco-card" role="article">
        <div class="update-components-actor"><span class="update-components-actor__title"><span aria-hidden="true">Jane Doe</span></span></div>
        <div class="feed-shared-update-v2__description"><span dir="ltr">${text}</span></div>
        <div class="feed-shared-social-action-bar">
          <span class="reactions-react-button feed-shared-social-action-bar__action-button">
            <button aria-pressed="${first && liked}" aria-label="${first && liked ? 'Unreact Like' : 'React Like'}" class="react-button__trigger artdeco-button artdeco-button--muted artdeco-button--4 artdeco-button--tertiary" type="button" ${first ? 'data-first' : ''}>
              <span class="artdeco-button__text">Like</span>
            </button>
          </span>
          <button aria-label="Comment" class="artdeco-button comment-button" type="button"><span>Comment</span></button>
          <button aria-label="Repost" class="artdeco-button" type="button"><span>Repost</span></button>
        </div>
      </div>
    </div>`
  function render() {
    document.getElementById('rail').innerHTML =
      mode === 'none'
        ? '<div class="artdeco-empty-state"><h2 class="artdeco-empty-state__headline">Jane hasn’t posted yet</h2><p>Recent posts Jane shares will be displayed here.</p></div>'
        : post('7300000000000000002', 'Excited to share our Q3 results!', true) + post('7300000000000000001', 'We are hiring!', false)
  }
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-first]')
    if (!b) return
    liked = !liked
    window.__log.push({ type: 'like', liked })
    setTimeout(render, 100)
  })
  render()
</script>
</body>
</html>
